<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Dark / Carrd Style</title>

  <!-- Vinculación de los 3 archivos CSS externos -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

  <main class="main-card">
    <!-- Encabezado superior -->
    <header class="card-header">
      <span>sys://perfil-web/v1.0</span>
    </header>

    <!-- Caja de perfil y foto -->
    <div class="profile-box">
      <img src="https://picsum.photos/300/300" alt="Foto de perfil">
      <div>
        <h1 class="user-title">Zilki</h1>
        <p class="user-handle">@usuario &bull; dev &bull; Santiago, CL</p>
      </div>
    </div>

    <!-- Sobre mí / BYF -->
    <section class="info-section">
      <h2 class="section-title">ABOUT ME</h2>
      <p class="section-text">Estudiante apasionado por el desarrollo web, la estética dark grunge y el código limpio.</p>
    </section>

    <!-- Lista de gustos / Yes -->
    <section class="info-section">
      <h2 class="section-title">FAVORITES</h2>
      <ul class="tag-list">
        <li class="tag-item">Guitarras</li>
        <li class="tag-item">Dark Synth</li>
        <li class="tag-item">Minimalismo</li>
        <li class="tag-item">Bebidas frías</li>
        <li class="tag-item">Desarrollo Web</li>
      </ul>
    </section>

    <!-- Enlaces -->
    <section class="info-section links-section">
      <h2 class="section-title">LINKS</h2>
      <div class="links-container">
        <a class="social-link" href="https://github.com" target="_blank">GitHub</a>
        <a class="social-link" href="https://instagram.com" target="_blank">Instagram</a>
      </div>
    </section>
  </main>

</body>
</html>
